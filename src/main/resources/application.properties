spring.application.name=authdemo

# ==============================================================
# DATABAZE
# ==============================================================
# Adresa se bere z ENV (musi byt localhost:3306, protoze tam usti tunel)
spring.datasource.url=${DATASOURCE_URL:${DATABASE_URL:}}
spring.datasource.username=${DATASOURCE_USER:${DATABASE_USERNAME:}}
spring.datasource.password=${DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.hikari.data-source-properties.zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.initialization-fail-timeout=10000

# Ovladač pro MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================
# HIBERNATE & JPA
# ==============================================================
# Pouzijeme tento moderni dialekt (entity uz mame opravene pro starou DB)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Automaticka aktualizace tabulek
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

# ==============================================================
# LOGOVANI
# ==============================================================
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:INFO}
logging.level.org.springframework.transaction=INFO
logging.level.org.springframework.orm.jpa=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.com.example.authdemo=${APPLICATION_LOG_LEVEL:INFO}
logging.level.org.springframework.mail=INFO
logging.level.org.eclipse.angus.mail=INFO

# ==============================================================
# SERVER & SESSION
# ==============================================================
server.port=${PORT:8080}
server.servlet.session.timeout=${SESSION_TIMEOUT:20m}
server.servlet.session.persistent=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:50}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:5}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}

# Zobrazovani chyb
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

spring.mvc.format.date=yyyy-MM-dd

# ==============================================================
# EMAIL (Mailtrap)
# ==============================================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.debug=false

# Bezpečné cookies a korektní HTTPS schéma za Render proxy.
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:JSESSIONID}
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Stabilní klíč nastavte na Renderu jako REMEMBER_ME_KEY. Bez něj se při startu
# vygeneruje náhodný klíč a staré remember-me cookies přestanou platit.
security.remember-me.key=${REMEMBER_ME_KEY:}
