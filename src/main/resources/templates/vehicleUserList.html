<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Správa oprávnění</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .print-only { display: none; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background-color: white; }
            .print-container { width: 100%; max-width: 100%; padding: 0; margin: 0; }
            table { border-collapse: collapse; width: 100%; }
            th, td { border: 1px solid #ddd; padding: 8px; color: black; font-size: 12px; }
            .shadow, .rounded-lg { box-shadow: none !important; border-radius: 0 !important; }
        }
    </style>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="apple-touch-icon" href="/images/favicon.png">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col text-gray-800">

<div class="no-print">
    <th:block th:if="${user.role == 'ADMIN' || user.role == 'OWNER' || user.role == 'SUPER_ADMIN'}">
        <div th:replace="~{fragments/headerAdmin :: mainHeader}"></div>
    </th:block>
    <th:block th:unless="${user.role == 'ADMIN' || user.role == 'OWNER' || user.role == 'SUPER_ADMIN'}">
        <div th:replace="~{fragments/header :: mainHeader(title='Správa oprávnění')}"></div>
    </th:block>
</div>

<div class="flex-grow container mx-auto px-4 py-8 print-container">
    <div class="mx-auto max-w-4xl rounded-xl bg-white p-6 shadow-lg">
        <div class="mb-6 text-center">
            <h1 class="text-2xl font-bold text-gray-800 break-words">
                Správa oprávnění:
                <span th:text="${vehicle.displayName}" class="block text-gray-900 md:inline"></span>
            </h1>
            <div class="print-only mt-2 text-xl font-bold uppercase tracking-wider border-b-2 border-gray-300 pb-1 mb-2">
                Kategorie: Oprávnění uživatelů
            </div>
            <p class="text-gray-600 mt-1 text-sm md:text-base">
                Výrobní číslo: <span th:text="${vehicle.serialNumber}" class="font-semibold"></span>
            </p>
        </div>

        <form th:action="@{/admin/vehicles/{vehicleId}/permissions(vehicleId=${vehicle.id})}" method="post" class="space-y-6">

        <div class="overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm">
            <table class="min-w-full divide-y divide-gray-200 table-fixed">
                <thead class="bg-gray-50">
                <tr>
                    <th scope="col" class="w-auto px-3 md:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        Uživatel
                    </th>

                    <th scope="col" class="hidden md:table-cell px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        Email
                    </th>

                    <th scope="col" class="w-16 md:w-24 px-1 md:px-2 py-3"><span class="sr-only">Oprávnění vidět</span></th>

                    <th scope="col" class="w-16 md:w-24 px-1 md:px-2 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
                        <span class="sr-only">Oprávnění údržby</span>
                    </th>

                    <th th:unless="${vehicleManager}" scope="col" class="w-16 md:w-24 px-1 md:px-2 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
                        <span class="sr-only">Oprávnění správce</span>
                    </th>
                </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">

                <tr th:if="${users.empty}">
                    <td th:attr="colspan=${vehicleManager ? 4 : 5}" class="px-6 py-8 text-center text-gray-500">
                        V systému nejsou žádní další uživatelé.
                    </td>

                </tr>

                <tr th:each="u : ${users}" class="hover:bg-gray-50 transition">

                    <td class="px-3 md:px-6 py-4 align-middle overflow-hidden">
                        <div class="flex items-center">
                            <div class="flex-shrink-0 h-8 w-8 md:h-10 md:w-10">
                                <div class="h-8 w-8 md:h-10 md:w-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs md:text-sm border border-blue-200">
                                    <span th:text="${#strings.substring(u.firstName,0,1) + #strings.substring(u.lastName,0,1)}"></span>
                                </div>
                            </div>
                            <div class="ml-3 md:ml-4 min-w-0 flex-1">
                                <div class="text-sm font-bold text-gray-900 truncate pr-2" th:text="${u.firstName + ' ' + u.lastName}"></div>
                                <div class="text-xs text-gray-500 truncate pr-2" th:text="${u.email}"></div>
                            </div>
                        </div>
                    </td>

                    <td class="hidden md:table-cell px-6 py-4 whitespace-nowrap text-sm text-gray-500 align-middle" th:text="${u.email}"></td>

                    <td class="px-1 md:px-2 py-4 whitespace-nowrap text-center align-middle">
                        <label class="inline-flex items-center justify-center w-full h-full cursor-pointer p-2">
                            <input type="checkbox"
                                   name="allowedUserIds"
                                   th:value="${u.id}"
                                   th:checked="${vehicle.allowedUsers.contains(u)}"
                                   title="Tento uživatel může dělat pouze denní zápisy a vidět historii závad vozidla."
                                   class="form-checkbox h-5 w-5 md:h-6 md:w-6 text-gray-700 border-gray-300 rounded focus:ring-gray-500 transition duration-150 ease-in-out cursor-pointer disabled:opacity-50 disabled:bg-gray-100 disabled:cursor-not-allowed">
                        </label>
                    </td>

                    <td class="px-1 md:px-2 py-4 whitespace-nowrap text-center align-middle">
                        <label class="inline-flex items-center justify-center w-full h-full cursor-pointer p-2">
                            <input type="checkbox" name="maintenanceUserIds" th:value="${u.id}"
                                   th:checked="${vehicle.maintenanceUsers.contains(u)}"
                                   title="Tento uživatel může provádět denní zápisy, evidovat údržbu a vidět historii závad vozidla."
                                   class="form-checkbox h-5 w-5 md:h-6 md:w-6 text-gray-700 border-gray-300 rounded focus:ring-gray-500 cursor-pointer disabled:opacity-50">
                        </label>
                    </td>

                    <td th:unless="${vehicleManager}" class="px-1 md:px-2 py-4 whitespace-nowrap text-center align-middle">
                        <label class="inline-flex items-center justify-center w-full h-full cursor-pointer p-2">
                            <input type="checkbox"
                                   name="vehicleAdminIds"
                                   th:value="${u.id}"
                                   th:checked="${vehicle.vehicleAdmins.contains(u)}"
                                   title="Tento uživatel může spravovat vozidlo, jeho údaje a přístupy ostatních uživatelů."
                                   class="form-checkbox h-5 w-5 md:h-6 md:w-6 text-gray-700 border-gray-300 rounded focus:ring-gray-500 transition duration-150 ease-in-out cursor-pointer disabled:opacity-50 disabled:bg-gray-100 disabled:cursor-not-allowed">
                        </label>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-6 flex flex-col items-center justify-between gap-4 md:flex-row">
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow-md hover:shadow-lg transition duration-200 flex items-center justify-center gap-2 md:w-auto">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                Uložit změny
            </button>
            <a th:href="@{/home(vehicleId=${vehicle.id})}"
               class="no-print inline-flex w-full items-center justify-center rounded bg-gray-500 px-6 py-2 font-bold text-white shadow transition duration-200 hover:bg-gray-600 md:w-auto">
                Zpět
            </a>
        </div>
        </form>

    </div>

</div>
<footer th:replace="~{fragments/footer :: mainFooter}"></footer>
</body>
</html>
