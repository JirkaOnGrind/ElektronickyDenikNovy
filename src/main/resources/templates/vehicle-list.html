<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Vyber stroje</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="apple-touch-icon" href="/images/favicon.png">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
<div th:replace="~{fragments/header :: mainHeader(${pageTitle})}"></div>

<div class="flex-grow container mx-auto px-4 py-8">
    <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
        <div th:each="vehicle : ${vehicles}"
             th:with="checkedToday=${checkedVehicleIds != null and checkedVehicleIds.contains(vehicle.id)}"
             class="bg-white p-6 rounded-lg shadow hover:shadow-lg transition-shadow"
             th:classappend="${checkedToday} ? ' ring-2 ring-green-400 bg-green-50' : ''">
            <div class="text-center">
                <h3 class="text-lg font-semibold text-gray-800 mb-2" th:text="${vehicle.displayName}"></h3>
                <span th:if="${checkedToday}"
                      class="inline-flex items-center px-3 py-1 mb-3 rounded-full text-xs font-bold bg-green-100 text-green-800 border border-green-200">
                    Dnes zkontrolováno
                </span>
                <p class="text-sm font-semibold text-black-700 mb-3" th:text="${vehicle.category.displayName}"></p>
                <p th:if="${vehicle.serialNumber}" class="text-gray-600 mb-1">
                    Vyr. cislo: <span th:text="${vehicle.serialNumber}"></span>
                </p>
                <p th:if="${vehicle.capacity}" class="text-gray-600 mb-1">
                    Nosnost: <span th:text="${vehicle.capacity}"></span> kg
                </p>
                <p th:if="${vehicle.registrationNumber}" class="text-gray-600 mb-4">
                    Evid. cislo: <span th:text="${vehicle.registrationNumber}"></span>
                </p>
                <p th:if="${vehicle.workplace}" class="text-gray-600 mb-4">
                    Pracoviště: <span th:text="${vehicle.workplace}"></span>
                </p>
                <a th:href="@{/home(vehicleId=${vehicle.id})}"
                   class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition inline-block w-full">
                    Vybrat tento stroj
                </a>
            </div>
        </div>

        <div th:if="${vehicles.empty}" class="text-center py-8 col-span-full">
            <p class="text-gray-500 text-lg mb-4">Zatim nejsou zadne registrovane stroje.</p>
        </div>
    </div>
</div>
</body>
</html>
