<!doctype html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><title>Header Fragment</title></head>
<body>
<div th:fragment="mainHeader">
    <header class="relative z-50 border-b border-gray-100 bg-white shadow-sm">
        <div class="container mx-auto px-4 py-3 sm:py-4">
            <div class="flex items-center justify-between gap-3">
                <div class="flex min-w-0 items-center gap-4 lg:gap-8">
                    <a href="https://www.provoznidenik.com" target="_blank" rel="noopener noreferrer"
                       class="flex-shrink-0 text-lg font-bold tracking-wide text-orange-600 transition hover:text-orange-700 sm:text-xl">provoznidenik.com</a>
                    <nav th:if="${companyContextActive != false}"
                         class="hidden items-center gap-1 md:flex" sec:authorize="hasAnyRole('ADMIN','OWNER','SUPER_ADMIN')">
                        <a th:href="@{/admin/dashboard}" class="rounded-lg px-3 py-2 text-sm font-medium text-gray-700 transition hover:bg-green-50 lg:text-base">Domů</a>
                        <a th:href="@{/admin/usersList}" class="rounded-lg px-3 py-2 text-sm font-medium text-gray-700 transition hover:bg-blue-50 lg:text-base">Uživatelé</a>
                        <a th:href="@{/admin/machines}" class="rounded-lg px-3 py-2 text-sm font-medium text-gray-700 transition hover:bg-orange-50 lg:text-base">Stroje</a>
                    </nav>
                </div>

                <div class="flex items-center gap-2 sm:gap-3">
                    <div th:if="${companyName != null}" sec:authorize="hasRole('SUPER_ADMIN')" class="hidden items-center gap-2 lg:flex">
                        <span class="rounded-full border border-orange-200 bg-orange-50 px-3 py-1.5 text-sm font-semibold text-orange-800" th:text="${companyName}">Firma</span>
                        <a th:href="@{/super-admin/dashboard}" class="rounded-lg border border-gray-200 px-3 py-2 text-sm font-semibold text-indigo-600 hover:bg-indigo-50">Změnit firmu</a>
                    </div>

                    <details class="group relative" sec:authorize="isAuthenticated()">
                        <summary class="flex cursor-pointer list-none items-center gap-2 rounded-xl border border-gray-200 bg-gray-50 px-2.5 py-2 shadow-sm transition hover:border-orange-200 hover:bg-orange-50 focus:outline-none focus:ring-2 focus:ring-orange-200 sm:px-3">
                            <span class="flex h-8 w-8 items-center justify-center rounded-full bg-orange-100 text-orange-700">
                                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 20.118a7.5 7.5 0 0115 0A17.9 17.9 0 0112 21.75a17.9 17.9 0 01-7.5-1.632z"/></svg>
                            </span>
                            <span class="hidden max-w-40 sm:block">
                                <span class="block truncate text-sm font-semibold leading-tight text-gray-800" th:text="${loggedInUserName != null ? loggedInUserName : #authentication.name}">Jan Novák</span>
                                <span class="block text-[11px] leading-tight text-gray-500">Můj profil</span>
                            </span>
                            <svg class="hidden h-4 w-4 text-gray-400 transition group-open:rotate-180 sm:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                        </summary>
                        <div class="absolute right-0 mt-2 w-64 overflow-hidden rounded-xl border border-gray-200 bg-white shadow-xl">
                            <div class="border-b border-gray-100 px-4 py-3">
                                <p class="truncate text-sm font-semibold text-gray-900" th:text="${loggedInUserName != null ? loggedInUserName : #authentication.name}">Jan Novák</p>
                                <p class="truncate text-xs text-gray-500" sec:authentication="principal.username">admin@example.cz</p>
                            </div>
                            <div th:if="${companyContextActive != false}"
                                 class="border-b border-gray-100 py-1 md:hidden" sec:authorize="hasAnyRole('ADMIN','OWNER','SUPER_ADMIN')">
                                <a th:href="@{/admin/dashboard}" class="block px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50">Domů</a>
                                <a th:href="@{/admin/usersList}" class="block px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50">Uživatelé</a>
                                <a th:href="@{/admin/machines}" class="block px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50">Stroje</a>
                            </div>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="w-full px-4 py-3 text-left text-sm font-semibold text-red-600 transition hover:bg-red-50">Odhlásit se</button>
                            </form>
                        </div>
                    </details>
                </div>
            </div>
        </div>
    </header>
</div>
</body>
</html>
