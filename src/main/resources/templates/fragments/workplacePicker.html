<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="picker(fieldId, currentValue)"
          th:with="customValue=${currentValue != null and !#lists.contains(workplaceOptions, currentValue)}">
    <div data-workplace-picker>
        <label th:for="${fieldId}"
               class="block text-sm font-medium text-gray-700 mb-1">Pracoviště</label>

        <select th:id="${fieldId}" name="workplace" data-workplace-select
                class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
            <option value="" th:selected="${currentValue == null or currentValue.isBlank()}">
                Bez pracoviště
            </option>
            <option th:each="workplace : ${workplaceOptions}"
                    th:value="${workplace}"
                    th:text="${workplace}"
                    th:selected="${workplace == currentValue}">
            </option>
            <option value="__NEW__" th:selected="${customValue}">
                ＋ Nové pracoviště…
            </option>
        </select>

        <div data-workplace-new
             class="mt-3"
             th:classappend="${customValue} ? '' : ' hidden'">
            <label th:for="${fieldId + '-new'}"
                   class="block text-xs font-semibold text-gray-700 mb-1">
                Název nového pracoviště
            </label>
            <input th:id="${fieldId + '-new'}" name="newWorkplace" type="text"
                   th:value="${customValue ? currentValue : ''}"
                   maxlength="120" data-workplace-new-input
                   class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                   placeholder="Např. Hala A">
        </div>
    </div>
</th:block>
</body>
</html>
