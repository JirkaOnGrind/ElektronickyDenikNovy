<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Reset hesla</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="apple-touch-icon" href="/images/favicon.png">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

<div class="flex-grow flex items-center justify-center px-4">
    <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6">Reset hesla</h1>

        <p class="text-gray-600 text-center mb-6">
            Zadejte svou e-mailovou adresu a pošleme vám ověřovací kód pro změnu hesla.
        </p>

        <form th:action="@{/auth/send-verification}" method="post" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                <input type="email" id="email" name="email" required
                       th:value="${submittedEmail}"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg shadow hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition font-medium">
                Odeslat ověřovací kód
            </button>

            <div class="text-center">
                <p class="text-gray-600">
                    <a href="/login" class="text-blue-600 hover:text-blue-800 font-medium underline">
                        Zpět na přihlášení
                    </a>
                </p>
            </div>

            <div th:if="${error}"
                 class="mt-4 p-3 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg">
                <span th:text="${error}"></span>
            </div>
            <div th:if="${message}"
                 class="mt-4 p-3 text-sm text-green-700 bg-green-50 border border-green-200 rounded-lg">
                <span th:text="${message}"></span>
            </div>
        </form>
    </div>
</div>

</body>
</html>
