spring.datasource.url=jdbc:h2:mem:authdemo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.task.scheduling.enabled=false

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.invalid
spring.mail.password=test-only

security.remember-me.key=test-only-remember-me-key
SESSION_COOKIE_SECURE=false
